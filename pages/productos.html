    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css?v=7.0">
</head>
<body data-page="productos">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container">
            <div class="top-bar-left">
                <a href="tel:+584121234567"><i class="fas fa-phone"></i> +58 412-1234567</a>
                <a href="mailto:inversionesduri@gmail.com"><i class="fas fa-envelope"></i> inversionesduri@gmail.com</a>
            </div>
            <div class="top-bar-right">
                <a href="https://www.facebook.com/InversionesDuri?locale=es_LA" target="_blank" rel="noopener noreferrer" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/inversionesdurica/" target="_blank" rel="noopener noreferrer" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://wa.me/584121234567?text=Hola%20Inversiones%20Duri%2C%20quisiera%20m%C3%A1s%20informaci%C3%B3n" target="_blank" rel="noopener noreferrer" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html?v=15.0" class="nav-logo"><img src="../img/logo-duri.png" alt="Duri"><span>Duri</span></a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html?v=15.0" class="nav-link"><i class="fas fa-home" style="margin-right:6px; opacity:0.85;"></i> Inicio</a></li>
                <li><a href="productos.html?v=15.0" class="nav-link active"><i class="fas fa-box-open" style="margin-right:6px; opacity:0.85;"></i> Productos</a></li>
                <li><a href="pedidos.html?v=15.0" class="nav-link"><i class="fas fa-shopping-cart" style="margin-right:6px; opacity:0.85;"></i> Pedidos</a></li>
                <li><a href="servicios.html?v=15.0" class="nav-link"><i class="fas fa-tools" style="margin-right:6px; opacity:0.85;"></i> Servicios</a></li>
                <li><a href="nosotros.html?v=15.0" class="nav-link"><i class="fas fa-users" style="margin-right:6px; opacity:0.85;"></i> Nosotros</a></li>
                <li><a href="contacto.html?v=15.0" class="nav-link"><i class="fas fa-envelope" style="margin-right:6px; opacity:0.85;"></i> Contacto</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle" type="button" aria-label="Abrir menú"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <section class="page-hero">
        <div class="container">
            <h1><i class="fas fa-shopping-bag"></i> Nuestros Productos</h1>
            <p>Explora nuestra amplia variedad de productos de calidad</p>
        </div>
    </section>

    <section class="page-content">
        <div class="container">
            <!-- Buscador Predictivo en Vivo -->
            <div class="catalog-search-wrap" id="catalogSearchWrap">
                <div class="catalog-search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="catalogSearchInput" class="catalog-search-input" placeholder="Buscar cuadernos, lápices, resmas, cartuchos..." autocomplete="off" oninput="handleCatalogSearchInput(this.value)">
                    <button type="button" id="catalogSearchClear" class="catalog-search-clear" onclick="clearCatalogSearch()">&times;</button>
                </div>
                <div id="catalogPredictiveDropdown" class="catalog-predictive-dropdown"></div>
            </div>

            <!-- Filtros por Categoría, Disponibilidad y Ordenamiento -->
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; margin-bottom:26px;">
                <div class="filters-bar" style="margin-bottom:0;" id="categoryFilterBar">
                    <button class="filter-btn active" onclick="filterProducts('all',this)">Todos <span id="countAll"></span></button>
                    <button class="filter-btn" onclick="filterProducts('Útiles Escolares',this)">Útiles Escolares <span id="countUtiles"></span></button>
                    <button class="filter-btn" onclick="filterProducts('Papelería',this)">Papelería <span id="countPapeleria"></span></button>
                    <button class="filter-btn" onclick="filterProducts('Tecnología',this)">Tecnología <span id="countTecnologia"></span></button>
                    <button class="filter-btn" onclick="filterProducts('Accesorios',this)">Accesorios <span id="countAccesorios"></span></button>
                </div>

                <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
                    <label style="display:inline-flex; align-items:center; gap:6px; font-size:0.84rem; color:var(--text-secondary); cursor:pointer; user-select:none;">
                        <input type="checkbox" id="filterInStockOnly" onchange="applyCatalogFilters()" style="cursor:pointer; accent-color:var(--accent); width:15px; height:15px;">
                        <span>Solo en stock</span>
                    </label>
                    <select id="catalogSortSelect" onchange="applyCatalogFilters()" style="padding:7px 14px; border-radius:100px; border:1px solid var(--border); font-size:0.82rem; background:#fff; color:var(--text-primary); cursor:pointer; outline:none; font-family:var(--font);">
                        <option value="featured">Destacados</option>
                        <option value="price_asc">Precio: Menor a Mayor</option>
                        <option value="price_desc">Precio: Mayor a Menor</option>
                        <option value="name_asc">Nombre: A - Z</option>
                    </select>
                </div>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Skeletons se cargan dinámicamente -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Inversiones Duri C.A. Maracay, Estado Aragua.</p>
            </div>
        </div>
    </footer>
    <script src="../js/app.js?v=21.0"></script>
</body>
</html>
